# =============================================================
# config/pricing.yaml — price list for the AI models we use
#
# Used by src/generation/llm.py to estimate the cost of every
# API call (tokens in/out x price). Prices are US dollars per
# 1 million tokens, from Anthropic's public pricing page.
# If a model is missing here, its cost is logged as $0 with a
# warning, so add any new model you put in a channel config.
# =============================================================

claude-haiku-4-5:
  input_per_million: 1.00    # $ per 1M tokens we send
  output_per_million: 5.00   # $ per 1M tokens the model writes
  supports_effort: false      # Haiku 4.5 does not accept the effort parameter

claude-sonnet-4-6:
  input_per_million: 3.00    # $ per 1M tokens we send
  output_per_million: 15.00  # $ per 1M tokens the model writes
  supports_effort: true       # Sonnet 4.6 supports effort (low/medium/high/max)
