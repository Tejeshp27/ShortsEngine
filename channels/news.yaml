# =============================================================
# channels/news.yaml — config for the "News Explained" channel
#
# Every setting specific to this channel lives here.
# To add a new channel, create a new .yaml file in this folder.
# =============================================================

name: "News Explained"                                    # display name of the channel
niche: "US politics and current events"                   # what the channel covers
audience: "College students who don't follow the news closely"  # who we write for
tone: "Neutral, clear, engaging; explain jargon; present each side fairly"  # writing style

# Target video length in seconds (75s ≈ a short TikTok/Reel)
target_length_seconds: 75

# Models — cheap model for picking stories, stronger model for the script.
# Prices for each model live in config/pricing.yaml.
models:
  ranking: "claude-haiku-4-5"    # cheap + fast: picks the best story from headlines
  writing: "claude-sonnet-4-6"   # better writer: produces the final script

# Settings for each AI step
llm:
  ranking_max_tokens: 2000       # hard cap on how much the ranking model may write
  writing_max_tokens: 6000       # hard cap on how much the writing model may write
  ranking_effort: "low"          # how hard the model "thinks" (low = cheapest)
  writing_effort: "medium"       # a bit more care for the final script
  max_calls_per_run: 5           # spending guard: stop if a run tries more calls than this

# How stories are chosen
selection:
  hours_back: 24                 # only consider stories from the last N hours
  max_headlines_to_rank: 30      # send at most this many headlines to the ranking model

# How the full article is read before writing
articles:
  fetch_full_text: true          # download the chosen article page (cached, one request)
  max_chars: 6000                # trim article text to this length to save tokens

# RSS feeds — free public news sources
sources:
  - type: rss
    url: "https://feeds.npr.org/1001/rss.xml"
    name: "NPR News"
  - type: rss
    url: "https://www.pbs.org/newshour/feeds/rss/headlines"
    name: "PBS NewsHour"
  - type: rss
    url: "https://feeds.bbci.co.uk/news/world/us_and_canada/rss.xml"
    name: "BBC US & Canada"

# Video production settings (Phase 2)
video:
  # Which TTS engine to use:
  #   "macos"      — Apple neural voices (local, free, macOS only) — default
  #   "elevenlabs" — ElevenLabs API (best quality, ~$0.18/video); needs ELEVENLABS_API_KEY
  #   "kokoro"     — Kokoro ONNX (free, local, near-ElevenLabs quality); needs onnxruntime
  #   "edge"       — Microsoft Edge neural TTS (free, online)
  tts_provider: "macos"

  # macOS voice — used when tts_provider = "macos".
  # Run `say --voice "?" | grep en_US` to see all installed voices.
  # Warm female: "Flo (English (US))", "Shelley (English (US))", "Sandy (English (US))"
  # Professional male: "Reed (English (US))", "Rocko (English (US))"
  macos_voice: "Flo (English (US))"

  # ElevenLabs voice — used when tts_provider = "elevenlabs".
  # Use a voice name (e.g. "Rachel", "Josh") or paste a voice ID from your account.
  # Browse voices at elevenlabs.io/voice-library.
  elevenlabs_voice: "Rachel"

  # Kokoro voice — used when tts_provider = "kokoro".
  # American female: af_heart (warm), af_sarah (clear), af_bella (expressive)
  # American male:   am_michael (warm), am_adam (deep)
  kokoro_voice: "af_heart"

  # edge-tts voice — used when tts_provider = "edge" (fallback).
  voice: "en-US-AriaNeural"

  font_size: 90                # caption font size (pixels on 1080×1920 canvas)
  words_per_caption: 3         # how many words to show at once in captions

  # Background music — only used when you pass --music at the command line.
  # Requires MUBERT_API_KEY and MUBERT_EMAIL in .env (free tier at mubert.com/api).
  # music_mood options: focused, calm, intense, happy, sad, inspirational
  music_mood: "focused"
  # music_volume: how loud the music is relative to the voiceover.
  # 0.0 = silent, 1.0 = same level as voiceover. 0.12 (12%) is subtle and professional.
  music_volume: 0.12

# Platforms to publish to (Phase 4+)
platforms:
  - tiktok
  - instagram
