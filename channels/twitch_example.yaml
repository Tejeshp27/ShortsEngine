# =============================================================
# channels/twitch_example.yaml — example Twitch clip channel
#
# Copy this file to channels/twitch.yaml and fill in your details.
# Delete or comment out sections that don't apply yet.
#
# RULES:
#   - You MUST get written permission from each streamer before
#     using their clips. Document this permission somewhere.
#   - Do not use this config until you have approval.
# =============================================================

# Display name shown in the dashboard and cost reports.
name: "Twitch Highlights"

# What the channel covers — used in AI prompts.
niche: "Funny and exciting moments from popular Twitch streams"

# Who watches this channel — used to tune the script tone.
audience: "Gamers aged 18-30 who watch Twitch regularly"

# How the scripts should sound.
tone: "Energetic, conversational, hype the moment without over-explaining"

# Target video length in seconds.
target_length_seconds: 45

# AI models to use for this channel.
# See config/pricing.yaml for model costs.
models:
  ranking: "claude-haiku-4-5"   # cheap model picks the best clip
  writing: "claude-sonnet-4-6"  # stronger model writes the voiceover

# Twitch sources — one entry per streamer.
# You need WRITTEN PERMISSION from each streamer before adding them.
sources:
  - type: twitch
    broadcaster: "example_streamer"  # replace with real Twitch login
    hours_back: 24                   # look for clips from the last 24 hours
    max_clips: 10                    # fetch up to 10 clips to rank

# Which platforms to publish to.
platforms: [tiktok]

# Optional posting schedule (remove if posting manually).
# schedule:
#   utc_offset_hours: -5     # Eastern Time
#   post_times: ["16:00"]    # post at 4pm ET
#   platforms: [tiktok]

# LLM call limits and token budgets.
llm:
  max_calls_per_run: 5
  ranking_max_tokens: 100
  ranking_effort: null
  writing_max_tokens: 1000
  writing_effort: "high"

# How many candidates to rank and what window to search.
selection:
  hours_back: 24
  max_headlines_to_rank: 10

# Article / clip text settings.
articles:
  fetch_full_text: false
  max_chars: 2000

# Video settings.
video:
  voice: "en-US-GuyNeural"   # male voice for gaming content
  font_size: 90
  words_per_caption: 3
  background_color: "#0e0e10"  # Twitch dark background
