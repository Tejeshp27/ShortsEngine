# Which clips to look at and how long the finished videos may be.
clips:
  hours_back: 24                    # only clips made in the last 24 hours
  clips_per_streamer: 5             # most-viewed clips to check per streamer per run
  min_views: 0                      # skip clips with fewer views than this
  skip_shorter_than_seconds: 8      # clips shorter than this are too short to post
  moment_min_seconds: 18            # shortest clip (owner 2026-11-20: ~10 s one-liners are far too short; hits median 26-33 s)
  moment_max_seconds: 90            # and at most this long (was 60; TikTok study: breakouts run longer, stories need their arc)

# Speech-to-text, run locally with whisper.cpp (free; brew install whisper-cpp).
transcription:
  whisper_model: "small.en"   # small.en (~466 MB, better with game noise) or base.en (~142 MB, faster)
  language: "en"              # language spoken on the streams
  engine: auto                # auto = whisper.cpp if installed (kept shouted speech faster-whisper skipped), else faster-whisper

# How the 1080x1920 vertical video is laid out.
layout:
  mode: fit-blur              # fit-blur = whole uncropped picture on a blurred copy; split = gameplay top + facecam bottom; center-crop = middle slice only
  split_gameplay_share: 0.6   # split only: share of the screen height for gameplay (the facecam gets the rest)
  split_facecam_position: top # split only: facecam above the gameplay (top) or below it (bottom); top keeps the face clear of the app's buttons
  foreground_center: 0.45     # fit-blur only: where the picture's middle sits (0.5 = centre; lower leaves more room for captions below)
  gameplay_focus_x: 0.5       # split/center-crop: which part of the gameplay to keep (0 = left, 0.5 = middle, 1 = right)
  background_blur: 20         # fit-blur: blur strength of the background copy
  background_darken: 0.12     # fit-blur: how much darker the background is (0 = not darker), so the real picture stands out

# Export quality; source-native 1080p should be captured before enlarging camera/game crops.
encoding:
  frame_rate: source          # keep the stream's own frame rate (60 fps stays 60); or a fixed number like 30
  max_frame_rate: 60          # never output more than this
  crf: 16                     # H.264 quality: lower = more detail, bigger file (16 keeps extra detail for the platforms' re-compression)
  preset: slow                # slower presets compress better at the same quality (more CPU time)
  profile: high               # H.264 "high" profile, what TikTok/YouTube expect

# Lowest acceptable source quality. Always start from the highest-resolution copy available.
source:
  min_height: 720             # sources below 720p are flagged in the quality report
  reject_below_min: false     # true = refuse to render them instead of warning

# Speech emphasis for every newly rendered clip; original source recordings stay untouched.
audio:
  speech_enhancement: true    # lift centred voices above stereo game sound (FFmpeg dialoguenhance)
  dialogue_boost: 2.0         # dialogue emphasis strength (0–3); mixed-in game dialogue may also be lifted
  highpass_hz: 80             # remove rumble below this pitch (0 = off)
  noise_reduction_db: 10      # light FFT noise reduction (afftdn) in dB (0 = off; above ~20 starts to sound watery)
  compressor: true            # gently even out sudden shouts and loud effects
  target_lufs: -14            # final loudness (TikTok/YouTube target), two-pass loudnorm
  true_peak_db: -1.0          # loudest allowed peak; nothing clips

# Profanity bleeping. Edit the word list in config/profanity.yaml.
bleep:
  enabled: true               # mute each listed word (and play a beep if volume > 0)
  word_list: "config/profanity.yaml"  # editable list of words to bleep
  padding_seconds: 0.08       # extra muted time before and after each word (precise word edges can still be ~0.1 s off)
  min_seconds: 0.15           # shortest beep, so a quick word is not just a click
  tone_hz: 1000               # beep pitch (1 kHz is the classic TV bleep)
  volume: 0                   # beep loudness vs. the voice it replaces (1 = the same; 0.1 = faint; 0 = no tone, the word is just muted — owner choice 2026-11-20)
  mask_captions: true         # show "f******" in the burned-in captions too
  precise_timing: true        # re-time each swear word with faster-whisper so the beep sits exactly on it
  max_seconds_per_letter: 0.09  # a word that can't be re-timed is bleeped at most this long per letter, so the next words are heard

# Burned-in word-by-word captions from the transcript.
captions:
  words_per_caption: 2        # words on screen at once (top clippers show 1-2 big words)
  font_size: 84               # text height in pixels
  text_color: "#FFFFFF"       # colour of the words
  highlight_color: "#FFE14D"  # colour of the word being spoken right now
  center_y: null              # null = the layout picks a spot clear of gameplay and the app's buttons; or a pixel height (300–1480)
  font_path: ""              # optional local TTF/OTF path; empty uses bundled Montserrat
  outline_color: "#000000"   # outline color for contrast on bright gameplay
  outline_width: 6           # outline thickness in output pixels
  streamer_voice_only: true  # captions show only the streamer's voice (game characters, other players and music are left out)
  voice_match_min: 0.6       # how similar (0-1) a voice must be to the streamer's to be captioned; higher = stricter
  style: punch               # punch = 1-2 big capital words, spoken word coloured (what top clippers use); clean; bold; boxed; quote
  other_voices: exchange     # exchange = keep another person's words when they talk WITH the streamer (not over game music); none; all
  check_accuracy: true       # remove Whisper mistakes: "thanks for watching" over silence, repetition loops, words where nobody speaks
  other_speaker_color: "#7FE7FF"  # words from another person (friend, guest) in this colour, so viewers see who talks
  sound_labels: true         # show *LAUGHING* / *SCREAMING* when those are heard and nobody is talking

# Optional editing of genuine audio silence. Reactions/game sounds stay intact.
editing:
  trim_quiet_start: true       # start just before the first spoken word, so the clip never opens on dead air
  speech_lead_seconds: 0.25    # sound kept before that first word
  trim_quiet_end: true         # end soon after the last spoken word when a long quiet stretch follows
  speech_tail_seconds: 0.8     # sound kept after that last word
  max_quiet_end_seconds: 2.5   # a quiet ending shorter than this is kept as it is
  remove_long_silence: false   # opt in after reviewing this channel; preserves caption timing through cuts
  silence_db: -45             # audio below this dB level counts as silent
  minimum_silence_seconds: 2.5 # keep shorter pauses; remove only the middle of longer silent gaps

# The hook title shown at the start of the video.
hook_title:
  seconds: 0                  # 0 = the context line stays up the whole clip (as top clippers do)
  style: outline              # outline = white text with a black outline (like top clips); box = dark text on a white box
  font_size: 80               # text height in pixels
  max_words: 11               # the context line is cut to this many words
  use_llm: true               # use the existing cached/metered clip_pick model for contextual titles; scoring stays local

# Tone for model-written hooks and post descriptions; claims must come from the selected moment.
metadata:
  style: "Natural, specific titles a Twitch viewer would write: who did what, from the payoff. At most one capitalised word and one emoji. No generic hype, no invented events." # used only by the older per-clip title path; the editor model (ranking section) writes titles now

# Small streamer credit tag in the top-left corner. Post captions always credit the streamer too.
credit:
  enabled: false              # show the tag in the video (off: the streamer credit is in the post caption instead)
  seconds: 4                  # how long it stays on screen from the start (0 = the whole video)
  font_size: 34               # text height in pixels

# Where approved clips go. TikTok receives them as drafts (you post in the app);
# YouTube receives them with the privacy setting below (public on this channel).
platforms: [tiktok, youtube]

# Caption text. TikTok: you paste it in the app (drafts cannot carry a caption).
# YouTube: it becomes the description (with #Shorts added).
publishing:
  use_legacy_env_tokens: false     # use this channel's own connections, never the news accounts
  hashtags: ["#twitch", "#kick"]   # added after the streamer credit (generic tags like #streamer #fyp were more common on flops)

# YouTube upload settings.
youtube:
  privacy: public   # owner choice 2026-11-19: post publicly straight away (private or unlisted also allowed)
  category_id: 20   # YouTube's "Gaming" category

# Automatic sending to TikTok drafts. While the dashboard runs, the newest
# approved clip is sent within 30 minutes of each time (one per time slot).
schedule:
  timezone: "America/Chicago"      # your local time zone
  post_times: ["12:00", "19:00"]   # 24-hour clock

# Raw-source collection settings for the current acquisition-first phase.
discovery:
  enabled: true               # metadata discovery follows the existing automation Start/Stop choice
  interval_seconds: 21600     # default: check public clips and archived VODs every six hours
  hours_back: 168             # discover clips from the last seven days using fixed start/end times
  max_pages: 10               # at most ten pages of 100 entries per creator and source type; report partial results

# Raw uploads are separate from metadata-only discovery.
acquisition:
  only: false                 # false = recorded/imported sources are clipped automatically (posting still follows publish_dry_run)
  max_upload_mb: 2048          # bounded browser upload size; large existing recordings can use local-path import

# Free, explainable local scoring. Scores estimate usefulness, not future views.
analysis:
  max_clips_per_recording: 3   # maximum distinct moments from each completed recording
  minimum_score: 55           # estimated 0–100 score required before rendering
  candidate_seconds: 35       # preferred duration before sentence/context adjustments
  context_seconds: 5          # begin this many seconds before a detected reaction peak
  use_llm: false              # optional metered Claude metadata; local text is free by default
  weights:                    # relative weights; unavailable dimensions are excluded
    entertainment: 0.20       # excitement terms plus audio contrast, not a semantic certainty
    hook: 0.15                # an interesting opening in the first six seconds
    audience: 0.35            # live chat bursts + viewer-made clips: the strongest sign people reacted (omitted when absent)
    clarity: 0.15             # speech coverage and complete endings
    audio: 0.08               # audible sound, penalizing probable clipping
    visual: 0.07              # sampled frame changes; does not recognize game events
  excitement_terms: [wow, what, wait, unbelievable, "no way", amazing, why]  # speech cues to look for

# Moment ranking (src/clips/ranking.py, src/clips/editor.py; research: docs/VIRAL_CONTENT_RESEARCH.md).
# Seven categories (humor, surprise, hook, clarity, pacing, conversation, quality) with versioned
# weights; weak, confusing or duplicate moments are rejected, so a dull hour gives fewer or no clips.
ranking:
  enabled: true               # false = the older analysis.weights scoring below
  profile: "config/clip_ranking/v2.yaml"  # v2 = stricter (requires an unexpected event); point back at v1.yaml to roll back
  ab_profile: ""              # optional A/B test: a second profile file used for every other recording ("" = off)
  use_editor_model: true      # the clip_pick model reads each shortlisted moment and judges the joke (~1-2 cents per recorded hour)
  shortlist_size: 6           # moments per recording the model reviews (more = slightly higher cost)
  context_seconds: 20         # transcript shown before each moment so the model can find where the setup starts

# Face-aware framing (src/clips/framing.py): finds the streamer's face in each clip, never cuts the head.
framing:
  enabled: true               # false = the fixed layout settings above
  sample_frames: 12           # frames checked for faces per clip
  full_camera_face_height: 0.2   # a face this tall (share of the picture) = IRL/full camera: tall crop around the person
  gameplay_share: 0.55        # stacked layout: gameplay's share of the screen (face gets the rest, on top)
  reaction_gameplay_share: 0.5   # same for reaction/conversation moments (bigger face)
  face_share: 0.34            # how much of the face panel's height the face fills (0.3 = head and shoulders, like clipping channels)
  max_zoom: 4.0               # never enlarge the webcam more than this; beyond it the whole picture is used

# Smart trimming (src/clips/trimming.py): tight start/end, dead air cut, comedic pauses kept.
trimming:
  enabled: true               # false = keep the chosen start/end exactly
  lead_seconds: 0.25          # sound kept before the first line
  max_dead_air_seconds: 2.5   # silent gaps longer than this may be shortened (was 1.4; TikTok study 2026-11-21: breakouts keep more quiet pauses, 18/24 and 13/20 accounts)...
  keep_gap_seconds: 0.5       # ...down to this
  comedic_pause_seconds: 2.5  # the pause right before the payoff may stay this long
  reaction_tail_seconds: 1.0  # kept after the payoff line
  max_tail_seconds: 3.0       # longest tail while people are still laughing
  max_cuts: 3                 # most jump cuts per clip (no over-editing)

# Title rules (src/clips/titles.py): separate hook text, YouTube title, TikTok description, hashtags.
titles:
  hook_max_words: 11          # on-screen context line (5-11 words explaining the situation)
  youtube_max_words: 12       # YouTube Shorts title (research median: 9 words)
  max_emoji: 1                # most emoji in a title
  max_hashtags: 4             # streamer, platform, game, one channel tag
  minimum_score: 55           # title ideas scoring below this (0-100) are replaced by a quote from the clip

# Final quality control (src/clips/qa.py).
qa:
  minimum_score: 60           # clips below this QA score (0-100) are rejected (skipped, never regenerated in a loop)
  flag_below: 75              # clips below this are kept but flagged for your review
  max_repairs: 1              # automatic re-renders with the whole picture for a framing problem
  min_caption_confidence: 0.6 # captions below this confidence fail the caption check

# Small edits seen in top clips (src/clips/production.py).
effects:
  payoff_zoom: 1.1            # push in 10% on the reaction after the payoff (1.0 = off)
  payoff_black_white: false   # true = reaction turns black-and-white (some top clippers do this)

# Packaging experiments (src/clips/packaging.py): every clip gets a different mix of title
# emoji/casing, hashtags, caption style, context-line time and post-caption style. Results from
# published posts (YouTube statistics) steer later choices until a clear winner appears.
# See progress: python -m src.clips --channel twitch_clips feedback
packaging:
  enabled: true               # false = always use the fixed settings above
  explore_min_tries: 3        # each option is tried at least 3 times before results steer the choice
  winner_confidence: 0.95     # an option is called the winner once it is 95% likely to be the best
  dimensions:                 # options being tested (remove one to stop testing it)
    title_emoji: [none, one]            # no emoji vs one at the end (😭 is the most common in hits)
    title_case: [natural, lowercase]    # "Jason Got Banned" vs "jason got banned"
    hashtags: [minimal, game, broad]    # streamer+platform / +game / +#funny #fyp
    caption_style: [punch, clean]       # big 1-2 capital words vs sentence case
    context_line: [whole, opening]      # context line the whole clip vs the first 8 seconds
    description: [summary, question]    # post caption describes the moment vs asks viewers a question

# Start from /clips/twitch_clips, or use the CLI watch command.
automation:
  enabled: false              # initial Start/Stop state; dashboard choice is persisted in SQLite
  poll_seconds: 120           # seconds between processing cycles (shorter so finished chunks from many streams do not queue up)
  stable_file_seconds: 60     # ignore recently modified inbox files; use completed recordings only
  max_recordings_per_run: 1   # bound expensive local work in each cycle
  max_attempts: 3             # stop automatic retries after this many analysis/render failures
  retry_seconds: 300          # initial retry delay; doubles after subsequent failures
  require_approval: true      # owner approves every clip before it can be posted (owner choice 2026-11-19)
  publish_dry_run: true       # scheduled publishing logs a plan and sends nothing until false
  max_uploads_per_day: 100    # effectively unlimited (owner 2026-11-20; the highest value the settings allow). The owner posts about 5 a day by hand; YouTube's default API quota still stops at ~6 uploads a day

# Rolling live recorder: records approved streamers' public live streams in
# chunks, turns each finished chunk into clips, then deletes the chunk so the
# disk is reused. Run by the clips supervisor; follows the Start/Stop button.
# Needs acquisition.only: false (otherwise chunks would never be clipped and deleted).
live_recording:
  enabled: false              # true = record streamers while they are live
  quality: "1080p60,1080p,best"   # Streamlink qualities to try, best first (720p60 halves disk use)
  chunk_minutes: 60           # length of each saved piece; clips come out after each piece ends
  overlap_seconds: 120        # last 2 minutes of the previous piece are added to the next, so a moment on the boundary is not split
  max_concurrent: 10          # record every focus streamer who is live (owner 2026-11-20: always record them); disk limits below still apply
  max_hours_per_streamer_per_day: 24  # no daily cap: record the whole stream (owner 2026-11-20)
  check_seconds: 60           # how often to check who is live (one Twitch API call for everyone)
  min_free_gb_to_start: 20    # free disk needed before a new recording starts
  stop_below_free_gb: 10      # running recordings stop if free disk drops below this
  chat: true                  # count Twitch chat messages while recording (counts only; no text or names saved)
  chat_bin_seconds: 5         # chat is counted in 5-second buckets
  chat_reaction_seconds: 4    # chat usually reacts this many seconds after the moment
  viewer_clip_weight: 3       # one viewer-made Twitch clip counts like 3x a normal bucket of chat
  keep_source_padding_seconds: 30   # footage kept on each side of a chosen moment after the full piece is deleted (for re-cuts)
  delete_raw_after_processing: true # delete each full piece once its clips are made
  delete_posted_after_hours: 24     # delete a finished video's file this long after it reached every platform (or was rejected)
  folder: "recordings/live"   # where pieces are written while recording (git-ignored)
