# =============================================================
# channels/twitch_clips.yaml — the Twitch + Kick highlights channel
#
# A "clips" channel does not write scripts. It takes real moments
# from approved streamers' Twitch and Kick streams, picks the best
# part, makes it vertical with captions and credit, and sends it to
# the normal review queue. Nothing is posted without your approval.
# Approved videos go to TikTok (drafts) and YouTube Shorts.
#
# Commands (see README "Clips channel"):
#   python -m src.clips --channel twitch_clips connect <twitch streamer>
#   python -m src.clips --channel twitch_clips run --dry-run
#   python -m src.clips --channel twitch_clips run
#   python -m src.clips --channel twitch_clips upload clip.mp4 --streamer <kick streamer> --i-own-this
#
# RULE: only add a streamer AFTER they agreed in writing (a DM is
# fine). The code refuses every streamer who is not listed below.
# =============================================================

# Display name shown in the dashboard and cost reports.
name: "Stream Highlights"

# "clips" tells the program this channel cuts real stream clips
# instead of writing news scripts. Leave it as "clips".
type: clips

# Set to false to pause the channel without deleting this file.
enabled: true

# What the channel covers. Given to the AI when it picks moments.
niche: "The funniest and most exciting moments from Twitch streams"

# Who watches. Helps the AI choose moments and write hook titles.
audience: "Gamers and stream viewers aged 16-30 scrolling TikTok"

# AI models (prices are in config/pricing.yaml).
models:
  clip_pick: "claude-haiku-4-5"   # cheap model: picks the moment and writes the hook title

# Spending guards for each run.
llm:
  max_calls_per_run: 15          # most paid AI calls one run may make (one per clip)
  clip_pick_max_tokens: 300      # hard cap on how much the model may write per clip (a short JSON answer)
  clip_metadata_max_tokens: 400  # hard cap for optional speech assessment/title/description in the new pipeline

# ---------------------------------------------------------------
# Approved streamers. Each one needs written permission FIRST.
#   Twitch streamers then run a one-time login so we may download
#   their clips automatically:
#     python -m src.clips --channel twitch_clips connect <username>
#   Kick has no official clip API: a Kick streamer sends you clip
#   files and you add each one with the "upload" command.
#
# Example (copy, remove the "#" and fill in real details):
#
#   - username: "examplestreamer"                 # their login name (the part after twitch.tv/ or kick.com/)
#     platform: "twitch"                          # "twitch" (clips fetched automatically) or "kick" (clips uploaded by you)
#     permission_note: "Said yes in a Twitch DM"  # how and where they agreed
#     permission_date: "2026-11-17"               # the day they agreed (YYYY-MM-DD)
#     permission_proof: "permissions/examplestreamer.png"  # optional: your screenshot (permissions/ is git-ignored)
#     facecam:                                    # optional: where their webcam sits in the 16:9 stream picture
#       x: 0.0        # left edge, as a fraction of the width (0 = far left, 1 = far right)
#       y: 0.0        # top edge, as a fraction of the height (0 = top, 1 = bottom)
#       width: 0.25   # webcam width, as a fraction of the stream width
#       height: 0.30  # webcam height, as a fraction of the stream height
#     layout: "split"   # optional: this streamer's own layout (fit-blur, split or center-crop); split needs facecam
# ---------------------------------------------------------------
# The owner confirmed consent for these eight creators in this conversation.
